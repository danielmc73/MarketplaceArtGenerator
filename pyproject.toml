[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MarketplaceArtGenerator"
version = "0.2.0"
description = "Professional Marketplace Image Generator"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Daniel Carmo" }]
dependencies = [
    "pillow>=11.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mag*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py312"
